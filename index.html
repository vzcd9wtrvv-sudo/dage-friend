<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07131d">
<title>大鴿好友模擬器 v3.0 Offline</title>
<style>
:root{--bg:#07131d;--panel:#0d2130;--line:#29495f;--txt:#edf5f9;--muted:#91a8b8;--gold:#e7b84f;--purple:#a681e8;--green:#62ca8e;--red:#e3777e}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#07131d,#050e17);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif}
body{padding-bottom:max(24px,env(safe-area-inset-bottom))}
button,input{font:inherit}.wrap{max-width:850px;margin:auto;padding:16px 14px 56px}.hero{text-align:center;padding:24px 0 14px}.logo{font-size:34px;font-weight:1000}.logo em{font-style:normal;color:var(--gold)}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#173c2c;color:#c9f2d8;font-size:11px;font-weight:900;margin-left:6px}.badge.off{background:#3c2b17;color:#f2dec9}
.card{background:linear-gradient(180deg,rgba(18,42,59,.97),rgba(10,28,42,.98));border:1px solid var(--line);border-radius:20px;padding:17px;margin:12px 0;box-shadow:0 14px 34px rgba(0,0,0,.22)}
.sub{color:var(--muted);font-size:13px;line-height:1.55}h2{font-size:18px;margin:0 0 12px}
label{display:block;font-size:14px;color:#c8d8e1;font-weight:800;margin:14px 0 8px}
input{width:100%;background:#091d2b;border:1px solid #365c73;color:#fff;border-radius:14px;padding:14px 15px;outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{background:#0b1f2d;border:1px solid #36596f;color:#f0f6f9;border-radius:16px;padding:13px;text-align:left;cursor:pointer}.choice.active{border-color:var(--gold)}.choice b{display:block;margin-bottom:5px}.choice span{font-size:12px;color:var(--muted)}
.btn{border:0;border-radius:15px;padding:13px 16px;font-weight:900;cursor:pointer}.primary{width:100%;background:linear-gradient(90deg,var(--gold),#d99a2f);color:#18212a}.ghost{background:#153047;color:#e4eef4;border:1px solid #355a72}.danger{background:#45242b;color:#ffe1e4;border:1px solid #72414a}.hidden{display:none!important}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#081a27;border:1px solid #29485d;border-radius:13px;padding:10px 8px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}.bar{height:6px;background:#06131d;border-radius:999px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--gold)}
.eventTitle{font-size:24px;font-weight:1000;line-height:1.3;margin:4px 0 10px}.eventText{line-height:1.75;color:#d0dde4}.opts{display:grid;gap:10px;margin-top:15px}.opt{background:#102a3d;border:1px solid #365a72;color:#f3f7f9;border-radius:15px;padding:14px;text-align:left;font-weight:850;cursor:pointer}.opt:disabled{opacity:.5;cursor:default}
.chat{margin-top:14px;background:#071722;border:1px solid #28495d;border-radius:14px;padding:12px}.chatLine{margin:8px 0;line-height:1.55;font-size:14px}.name{font-weight:900;color:#e8bd5b;margin-right:6px}.name.doctor{color:#b9a3ff}.name.npc{color:#8dc7df}
.result{margin-top:14px;padding:15px;border-radius:16px;background:#081a27;border:1px solid #365a72}.result h3{margin:0 0 8px}.deltaRow{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}.delta{font-size:11px;padding:3px 7px;border-radius:999px;background:#0a1b28;border:1px solid #35566b;color:#cfe0ea}.plus{border-color:#35634a;color:#bfe6cb}.minus{border-color:#704148;color:#ffd0d4}
.log{max-height:520px;overflow:auto}.logitem{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:13px;line-height:1.7}.logitem b{color:var(--gold)}.bio{white-space:pre-wrap;text-align:left;line-height:1.75;background:#091a27;border:1px solid #2c4d62;border-radius:14px;padding:14px;max-height:650px;overflow:auto}
.center{text-align:center}.rank{font-size:58px;font-weight:1000;color:var(--gold)}
@media(max-width:640px){.grid2{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.logo{font-size:30px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="logo">🕊️ <em>大鴿好友</em>模擬器 <span id="aiBadge" class="badge">OFFLINE ENGINE</span></div>
    <div class="sub">AI 主導劇情；加入 JSON 容錯與對話格式修復。</div>
  </div>

  <section id="setup" class="card">
    <h2>建立假好友</h2>
    <label>名字</label><input id="playerName" placeholder="例如：Lv.0 摯友">
    <label>世界種子</label><input id="seed" value="AI-DAGE-FOREVER">
    <label>好友風格</label>
    <div class="grid2">
      <button class="choice active" data-type="貼心型"><b>🙂 貼心型</b><span>比較容易取得信任。</span></button>
      <button class="choice" data-type="拱火型"><b>🔥 拱火型</b><span>事件更容易失控。</span></button>
      <button class="choice" data-type="情報型"><b>🗿 情報型</b><span>更常捲入博士與群友。</span></button>
      <button class="choice" data-type="雙面型"><b>🎭 雙面型</b><span>兩邊關係都能經營。</span></button>
    </div>
    <button id="startBtn" class="btn primary" style="margin-top:16px">開始 AI 人生</button>
  </section>

  <section id="game" class="hidden">
    <div class="card">
      <div class="topline">
        <div><b id="pname"></b><div class="sub" id="meta"></div></div>
        <div><span id="dateBadge" class="badge"></span><span id="ageBadge" class="badge"></span></div>
      </div>
    </div>

    <div class="card">
      <h2>大鴿目前狀態</h2>
      <div class="stats">
        <div class="stat"><b id="mood"></b><span>心情</span><div class="bar"><i id="moodBar"></i></div></div>
        <div class="stat"><b id="anger"></b><span>怒氣</span><div class="bar"><i id="angerBar"></i></div></div>
        <div class="stat"><b id="trust"></b><span>信任你</span><div class="bar"><i id="trustBar"></i></div></div>
        <div class="stat"><b id="suspicion"></b><span>懷疑你</span><div class="bar"><i id="suspicionBar"></i></div></div>
      </div>
      <div class="sub" id="statusLine" style="margin-top:10px"></div>
    </div>

    <div class="card">
      <div class="sub" id="eventTag"></div>
      <div id="eventTitle" class="eventTitle"></div>
      <div id="eventText" class="eventText"></div>
      <div id="dialogue" class="chat hidden"></div>
      <div id="options" class="opts"></div>
      <div id="result" class="result hidden"></div>
    </div>

    <div class="card">
      <h2>人生紀錄</h2>
      <div id="log" class="log"></div>
    </div>

    <button id="retireBtn" class="btn danger" style="width:100%">提前結束並生成傳記</button>
  </section>

  <section id="ending" class="card hidden center">
    <div class="sub">AI 人生總評</div>
    <div id="rank" class="rank"></div>
    <h2 id="endingTitle"></h2>
    <div id="endingSummary" class="sub" style="margin-bottom:14px"></div>
    <div id="biography" class="bio"></div>
    <button class="btn primary" onclick="location.reload()" style="margin-top:14px">重新投胎</button>
  </section>
</div>


<script>
function hashString(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const $=id=>document.getElementById(id), clamp=v=>Math.max(0,Math.min(100,v));
let rng=Math.random,chosenType="貼心型",S=null,currentEvent=null,busy=false;

document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".choice").forEach(x=>x.classList.remove("active"));
 b.classList.add("active");chosenType=b.dataset.type
});

const PEOPLE=["博士","伊神","盤咕","汪達","西雅兔哥","柳丁哥","醬財","養肌","莫提斯"];
const EVENT_LIBRARY=[

 {id:"weather-game",cat:"棒球",w:4,title:"球賽因天氣延誤",desc:"等待時間比比賽本身還折磨，大鴿每隔十分鐘就更新一次天氣雷達，群組最後變成氣象觀測站。",dlg:[["大鴿","這雨到底要下多久。"],["博士","照雷達至少還要一陣子。"]],choices:["陪他等","叫他去做別的事","故意說等等一定取消"],tags:["棒球","生活"]},
 {id:"phone-bug",cat:"生活",w:5,title:"手機突然出現怪問題",desc:"不是完全壞掉，但就是一直卡在最煩的位置。大鴿重開、清快取、換網路，每做一步都要在群組回報。",dlg:[["大鴿","剛剛明明還可以。"],["養肌","先重開機。"]],choices:["一步步幫他排查","叫他先放著","說一定是他亂按到"],tags:["生活","科技"]},
 {id:"old-friend",cat:"人際",w:4,title:"很久沒聯絡的人突然出現",desc:"對方一句簡單問候，讓大鴿一下想到很多以前的事情。他不確定該熱絡回覆，還是維持現在的距離。",dlg:[["大鴿","他怎麼突然找我。"]],choices:["叫他正常回覆","先觀察對方目的","直接問是不是有事"],tags:["人際","懷疑"]},
 {id:"promotion-rumor",cat:"工作",w:4,title:"工作上出現一個可能的變動",desc:"還沒正式確定，但同事之間已經開始傳消息。大鴿既想知道真相，又怕自己太早表態。",dlg:[["大鴿","到底是真的還假的。"]],choices:["叫他先等正式消息","幫他側面打聽","鼓勵他主動爭取"],tags:["工作","機會"]},
 {id:"sleep-debt",cat:"健康",w:5,title:"連續幾天睡不好",desc:"大鴿開始在半夜回訊息，白天又特別容易不耐煩。明明知道該早睡，還是一直滑手機看到更晚。",dlg:[["大鴿","我就是睡不著。"],["莫提斯","你先把手機放下。"]],choices:["勸他今晚真的早睡","陪他聊到想睡","叫他乾脆看球看到天亮"],tags:["健康","壓力"]},
 {id:"small-win",cat:"生活",w:6,title:"一件小事意外讓他心情變好",desc:"可能只是吃到想吃的東西、排隊比預期快，或剛好遇到一個好消息。事情很小，但他整季的語氣明顯比較輕。",dlg:[["大鴿","今天至少這件事還不錯。"]],choices:["順著好心情聊","叫他趁機做點正事","提醒他不要太早得意"],tags:["生活","心情"]},
 {id:"misread-text",cat:"社群",w:7,title:"他又把一句話看成另一個意思",desc:"對方只是隨手回覆，大鴿卻覺得那個語氣不對。你越解釋，他越覺得大家是不是在幫對方圓。",dlg:[["大鴿","你不覺得這句很怪嗎？"],["柳丁哥","真的沒有那個意思。"]],choices:["直接說他想太多","幫他逐句分析","先轉移話題"],tags:["社群","懷疑"]},
 {id:"group-invite",cat:"社群",w:5,title:"有人邀他加入新的群組",desc:"新群看起來熱鬧，但裡面也有幾個他不太熟的人。大鴿一邊說只是看看，一邊已經開始研究誰跟誰比較熟。",dlg:[["大鴿","我先進去看看而已。"],["盤咕","你每次都這樣講。"]],choices:["鼓勵他低調觀察","叫他不要亂加群","陪他研究群裡的人"],tags:["社群","人際"]},
 {id:"sale-item",cat:"消費",w:5,title:"一直想買的東西突然特價",desc:"折扣不算誇張，但剛好踩到他的心理價位。大鴿開始問每個人值不值得，問完後又逐一反駁。",dlg:[["大鴿","其實這價格可以吧。"],["汪達","你只是想找人同意。"]],choices:["說想要就買","叫他等一天再決定","故意推薦更貴的版本"],tags:["消費","財務"]},
 {id:"milestone",cat:"人生",w:3,title:"突然意識到時間過得很快",desc:"一個年份、一場比賽或某個人的近況，讓大鴿忽然開始回頭算自己這幾年到底做了什麼。",dlg:[["大鴿","怎麼一下就過這麼久了。"]],choices:["陪他認真回顧","叫他想下一步","用以前的黑歷史打斷感性"],tags:["人生","回顧"],cond:s=>s.year>=2023}
];

const REACTIONS={
 calm:["好啦，我知道了。","先這樣吧，我再看看。","其實也沒有到多嚴重。","嗯，這樣講好像也有道理。"],
 angry:["不是啊，這明明就很扯。","你們每次都先叫我冷靜，問題又不是我先開始。","我真的不懂這有什麼好護航的。","算了，我先不回了，不然等等又說我在吵。"],
 trust:["這個我只跟你講，你不要出去講。","你至少有在聽我講完。","好啦，這次我信你。","我本來不想講，但你應該懂。"],
 suspicious:["你真的確定不是在套我話？","我先問清楚，你不要等等又改口。","這件事我覺得沒有那麼單純。","先不要急，我想一下他為什麼會這樣講。"],
 amused:["靠，這也太剛好了吧。","好啦這個有好笑。","今天至少不是全部都在搞我。","這個我可以接受。"]
};

function statePayload(){
 return {
  player:{name:S.name,type:S.type},
  time:{year:S.year,quarter:S.quarter,age:S.age},
  stats:{mood:S.mood,anger:S.anger,trust:S.trust,suspicion:S.suspicion,stress:S.stress,social:S.social,wealth:S.wealth,love:S.love,health:S.health},
  relations:{blocks:S.blocks,blocked:S.blocked},
  flags:S.flags.slice(-12),
  memories:S.memories.slice(-12),
  lastCategory:S.lastCategory
 };
}
function render(){
 $("pname").textContent=S.name;$("meta").textContent=`${S.type} · 世界種子 ${S.seed}`;
 $("dateBadge").textContent=`${S.year} Q${S.quarter}`;$("ageBadge").textContent=`${S.age} 歲`;
 ["mood","anger","trust","suspicion"].forEach(k=>{$(k).textContent=Math.round(S[k]);$(k+"Bar").style.width=clamp(S[k])+"%"});
 $("statusLine").textContent=`${S.blocked?"目前被封鎖｜":""}壓力 ${Math.round(S.stress)}｜社群聲望 ${Math.round(S.social)}｜本季傳奇人物：${S.legendary||"無"}`;
 $("log").innerHTML=S.memories.slice().reverse().map(x=>`<div class="logitem"><b>${x.date}｜${x.title}</b><br>${x.summary}</div>`).join("");
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function showDialogue(lines){
 const d=$("dialogue");
 if(!Array.isArray(lines)||!lines.length){d.classList.add("hidden");d.innerHTML="";return}
 d.classList.remove("hidden");
 d.innerHTML=lines.slice(0,8).map(x=>`<div class="chatLine"><span class="name ${x[0]==="博士"?"doctor":x[0]==="大鴿"?"":"npc"}">${escapeHtml(x[0])}：</span>${escapeHtml(x[1])}</div>`).join("");
}
function weightedPick(items){
 const valid=items.filter(e=>!e.cond||e.cond(S));
 const recentIds=S.memories.slice(-6).map(m=>m.eventId);
 let pool=valid.map(e=>({...e,_w:e.w*(recentIds.includes(e.id)?0.12:1)*(S.lastCategory===e.cat?0.7:1)}));
 let total=pool.reduce((a,e)=>a+e._w,0),r=rng()*total;
 for(const e of pool){r-=e._w;if(r<=0)return e}
 return pool[0];
}
function personalizeEvent(base){
 let legendary="無",dlg=base.dlg.map(x=>[...x]);
 if(base.tags.includes("伊神")) legendary="伊神";
 else if(base.tags.includes("博士")) legendary="博士";
 else if(rng()<0.16){legendary=PEOPLE[Math.floor(rng()*PEOPLE.length)]; if(!dlg.some(x=>x[0]===legendary))dlg.push([legendary, legendary==="伊神"?"你們到底在繞什麼，講重點。":legendary==="博士"?"先把資料看清楚再講。":"我先看看你們在吵什麼。"])}
 let title=base.title,desc=base.desc;
 if(S.anger>75 && rng()<.35)desc+=" 他現在的火氣明顯比平常更大，連原本不相關的小事都容易被扯進來。";
 if(S.trust>70 && rng()<.25)desc+=" 不過這次他對你明顯比較沒有防備，願意多講一些平常不會公開說的東西。";
 if(S.suspicion>75 && rng()<.3)desc+=" 他同時一直在確認你是不是還知道別的內幕。";
 return {id:base.id,category:base.cat,title,description:desc,legendary,dialogue:dlg,choices:base.choices.map((text,i)=>({id:String.fromCharCode(97+i),text})),tags:base.tags};
}
function blockedEvent(){
 return {
  id:"blocked-"+S.blocks,category:"封鎖",title:"你還在大鴿的封鎖名單裡",
  description:"這一季你無法直接找他，只能從共同好友、群組動態或偶爾傳來的片段消息判斷他現在的狀態。",
  legendary:rng()<.35?"伊神":"無",
  dialogue:rng()<.5?[["盤咕","他現在還是不想回你。"]]:[["伊神","不爽就先不要講啊。"]],
  choices:[
   {id:"a",text:"先完全不打擾他"},
   {id:"b",text:"請共同好友只傳一句話"},
   {id:"c",text:"等一季後再看看"}
  ],tags:["封鎖"]
 };
}
function generateEvent(){
 if(busy)return;busy=true;
 $("result").classList.add("hidden");$("dialogue").classList.add("hidden");
 currentEvent=S.blocked?blockedEvent():personalizeEvent(weightedPick(EVENT_LIBRARY));
 S.legendary=currentEvent.legendary||"無";
 if(S.legendary==="伊神")S.ishinEncounters++;
 $("eventTag").textContent=currentEvent.category;
 $("eventTitle").textContent=currentEvent.title;
 $("eventText").textContent=currentEvent.description;
 showDialogue(currentEvent.dialogue||[]);
 $("options").innerHTML="";
 currentEvent.choices.forEach(c=>{
  const b=document.createElement("button");b.className="opt";b.textContent=c.text;b.onclick=()=>choose(c);$("options").appendChild(b);
 });
 busy=false;render();
}
function reactionFor(delta){
 let pool=REACTIONS.calm;
 if(S.anger+delta.anger>72)pool=REACTIONS.angry;
 else if(S.suspicion+delta.suspicion>70)pool=REACTIONS.suspicious;
 else if(S.trust+delta.trust>72)pool=REACTIONS.trust;
 else if(S.mood+delta.mood>70)pool=REACTIONS.amused;
 return pool[Math.floor(rng()*pool.length)];
}
function localDelta(choice){
 let d={mood:Math.round(rng()*9-4),anger:Math.round(rng()*11-4),trust:Math.round(rng()*9-4),suspicion:Math.round(rng()*9-3),stress:Math.round(rng()*7-3)};
 const t=choice.text;
 if(/安慰|幫|整理|勸|正常回覆|低調|休息|先存|先等|不打擾/.test(t)){d.trust+=6;d.anger-=4;d.mood+=4;d.stress-=3}
 if(/博士|伊神|刺激|開罵|起鬨|黑歷史|更貴|全部花|一定有戲/.test(t)){d.anger+=9;d.suspicion+=5;d.trust-=4}
 if(/分析|問清楚|研究|側面打聽/.test(t)){d.suspicion+=3;d.trust+=1}
 if(/工作|班|爭取/.test(currentEvent.category+currentEvent.title))d.stress+=2;
 if(currentEvent.category==="財務"||currentEvent.category==="消費")d.wealth=(/存|預算|補/.test(t)?4:-3);
 if(currentEvent.category==="感情")d.love=(/自然|正常|認真/.test(t)?5:2);
 if(currentEvent.category==="健康")d.health=(/休息|看一下/.test(t)?4:-2);
 return d;
}
function applyDelta(d){
 ["mood","anger","trust","suspicion","stress","social","wealth","love","health"].forEach(k=>{if(typeof d?.[k]==="number")S[k]=clamp(S[k]+d[k])});
}
function maybeBlock(){
 if(S.blocked)return;
 const p=0.035+S.anger/500+S.suspicion/650-S.trust/1100;
 if(rng()<Math.max(.015,p)){S.blocked=true;S.blocks++;S.flags.push("被封鎖")}
}
function maybeUnblock(choice){
 if(!S.blocked)return;
 const good=/不打擾|共同好友|等/.test(choice.text);
 if((good&&rng()<.42)||(S.trust>62&&rng()<.22)){S.blocked=false;S.flags.push("解除封鎖")}
}
function maybeEnd(){
 if(S.blocks>=5&&S.trust<20&&rng()<.25){S.forcedEnding="反覆封鎖後永久決裂";return true}
 if(S.suspicion>95&&S.trust<15&&rng()<.2){S.forcedEnding="假好友身分曝光";return true}
 if(S.age>=S.deathAge&&rng()<.08){S.forcedEnding="大鴿人生走到終點";return true}
 return false;
}
function summaryFor(choice,delta){
 const effects=[];
 if((delta.trust||0)>=5)effects.push("他對你的戒心稍微放下");
 if((delta.anger||0)>=7)effects.push("他的火氣明顯被你往上推");
 if((delta.suspicion||0)>=5)effects.push("他開始懷疑事情背後還有別的意思");
 if((delta.mood||0)>=4)effects.push("他的心情意外好了一點");
 if((delta.stress||0)<=-3)effects.push("至少壓力沒有繼續往上堆");
 if(!effects.length)effects.push("事情沒有立刻失控，但也沒有真的結束");
 return `你選擇「${choice.text}」。${effects.join("，")}。${currentEvent.description.slice(0,46)}${currentEvent.description.length>46?"……":""}`;
}
function choose(choice){
 if(busy)return;busy=true;
 [...$("options").children].forEach(x=>x.disabled=true);
 const d=localDelta(choice);
 const reaction=reactionFor(d);
 const summary=summaryFor(choice,d);
 applyDelta(d);
 maybeUnblock(choice);
 maybeBlock();

 const date=`${S.year} Q${S.quarter}`;
 S.memories.push({date,eventId:currentEvent.id,title:currentEvent.title,summary,choice:choice.text,category:currentEvent.category});
 S.lastCategory=currentEvent.category;

 const deltas=Object.entries(d).filter(([k,v])=>typeof v==="number"&&v!==0).map(([k,v])=>`<span class="delta ${v>0?"plus":"minus"}">${({mood:"心情",anger:"怒氣",trust:"信任",suspicion:"懷疑",stress:"壓力",social:"聲望",wealth:"財務",love:"感情",health:"健康"})[k]||k} ${v>0?"+":""}${Math.round(v)}</span>`).join("");
 $("result").classList.remove("hidden");
 $("result").innerHTML=`<h3>事情後來變成這樣</h3><div class="eventText">${escapeHtml(summary)}</div><div class="chat"><div class="chatLine"><span class="name">大鴿：</span>${escapeHtml(reaction)}</div></div><div class="deltaRow">${deltas}</div><button id="nextBtn" class="btn primary" style="margin-top:12px">進入下一季</button>`;
 render();
 $("nextBtn").onclick=()=>{
  if(maybeEnd()){finish();return}
  S.quarter++;if(S.quarter>4){S.quarter=1;S.year++}if(S.quarter===3)S.age++;
  busy=false;generateEvent();
 };
 busy=false;
}
function finish(){
 $("game").classList.add("hidden");$("ending").classList.remove("hidden");
 const years=(S.year-2019)+(S.quarter-1)/4;
 let title=S.forcedEnding;
 if(!title){
  if(S.trust>=78&&S.blocks<=1)title="大鴿少數真正信任的人";
  else if(S.blocks>=4)title="封鎖與解封的長期觀察者";
  else if(S.suspicion>=80)title="被懷疑了一輩子的假好友";
  else if(S.social>=70)title="群組生態的共同見證人";
  else title="大鴿多年好友";
 }
 let rank=S.trust>=80?"S":S.trust>=68?"A":S.trust>=50?"B":S.trust>=35?"C":"D";
 const topCats={};S.memories.forEach(m=>topCats[m.category]=(topCats[m.category]||0)+1);
 const fav=Object.entries(topCats).sort((a,b)=>b[1]-a[1])[0]?.[0]||"生活";
 const last=S.memories.slice(-5).map(m=>`${m.date} 的「${m.title}」`).join("、");
 const bio=`你陪大鴿走過約 ${years.toFixed(1)} 年。這一世最常發生的是「${fav}」類事件。期間他曾封鎖你 ${S.blocks} 次，最終信任 ${Math.round(S.trust)}、怒氣 ${Math.round(S.anger)}、懷疑 ${Math.round(S.suspicion)}。${S.ishinEncounters?`伊神總共在 ${S.ishinEncounters} 個季度直接出現，通常一出場就讓氣氛升溫。`:""}後期幾個重要片段包括 ${last||"一些平凡但難忘的小事"}。整體來看，你不是把他的人生變得完全順利的人，而是那個長期在旁邊影響他判斷、情緒與社群關係的人。`;
 $("rank").textContent=rank;$("endingTitle").textContent=title;$("endingSummary").textContent=`陪伴約 ${years.toFixed(1)} 年｜被封鎖 ${S.blocks} 次｜最終信任 ${Math.round(S.trust)}`;$("biography").textContent=bio;
}
$("startBtn").onclick=()=>{
 const name=$("playerName").value.trim()||"Lv.0 摯友",seed=$("seed").value.trim()||"OFFLINE-DAGE";
 rng=mulberry32(hashString(name+"|"+seed+"|"+chosenType));
 S={name,seed,type:chosenType,year:2019,quarter:1,age:27,mood:58,anger:42,trust:52,suspicion:18,stress:32,social:50,wealth:50,love:20,health:82,blocks:0,blocked:false,flags:[],memories:[],lastCategory:null,forcedEnding:null,legendary:"無",ishinEncounters:0,deathAge:Math.floor(70+rng()*16)};
 if(chosenType==="貼心型")S.trust+=8;if(chosenType==="拱火型")S.anger+=8;if(chosenType==="情報型")S.suspicion=Math.max(0,S.suspicion-3);if(chosenType==="雙面型"){S.trust+=3;S.suspicion+=3}
 $("setup").classList.add("hidden");$("game").classList.remove("hidden");
 $("aiBadge").textContent="OFFLINE ENGINE";$("aiBadge").classList.remove("off");
 render();generateEvent();
};
$("retireBtn").onclick=finish;
</script>
